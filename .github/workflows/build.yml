name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already ships with the Android SDK (ANDROID_HOME).
      # Just make sure the licences are accepted so Gradle can fetch what it needs.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs
        shell: bash
        run: gradle assembleDebug assembleRelease --console=plain 2>&1 | tee build.log

      # If the build fails, show just the compile errors on the run summary page.
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          {
            echo "### Compile errors"
            echo '```'
            grep -E '^(e|w): |error:|What went wrong' -A1 build.log | grep -E '^e: ' | sed -E 's#file://[^ ]*/app/src/main/java/com/ambient/launcher/##' | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | sed -E 's#file://[^ ]*/app/src/main/java/com/ambient/launcher/##' | head -60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbientHome-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbientHome-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to a GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
